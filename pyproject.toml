[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiractl"
version = "0.1.0"
description = "Internal Jira CLI for batch loading data and managing tickets"
authors = [{name = "Jose", email = "jose@ambientlabscomputing.com"}]
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
jiractl = "commands.cli:cli"

[tool.setuptools]
packages = [
    "commands",
    "commands.batch",
    "commands.batch.transform",
    "commands.batch.validate",
    "commands.batch.upload",
    "commands.config",
    "commands.create",
    "commands.create.epic",
    "commands.create.ticket",
    "commands.describe",
    "commands.list",
    "commands.search",
    "jira_api",
    "models",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
